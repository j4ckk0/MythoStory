# MythoStory: the installation's settings, read when the program starts — this file next to mythostory.jar.
# One "name=value" per line; a line starting with # is a comment. An option given on the command line wins over this file.
# (Not jtools-dist's own .ini: MythoStory reads only these two settings.)
#
# port   the port the server listens on (8090 when nothing says otherwise; 0 for any free one)
# host   the interface it listens on: 127.0.0.1, this computer only (the default); 0.0.0.0 serves the network
port=8090
