# The externals of the project: the software the build and the distributions need, none of it under source
# control. scripts/linux/setup.sh (Linux) / scripts\windows\setup.bat (Windows), JToolsFramework's devkit's, download
# these into external/ and deploy them under generic names, the only ones the scripts and the build know — Piper, the
# voices and the Android externals through MythoStory's own scripts/linux/setup.local.sh (no JMODS_MACOS: no macOS
# distribution):
#   external/jdk                 the JDK that compiles and runs the backend (the scripts' JAVA_HOME)
#   external/maven               Maven, which builds the whole project
#   external/node                Node.js and npm, which build the frontend (run by Maven: jtools-parent)
#   external/jdk-linux.tar.gz    this machine's JDK again, as its archive: the jlink that links the distributions'
#                                runtimes (scripts/linux/package.sh)
#   external/jmods-linux.tar.gz  the jmods each platform's runtime is linked from: from Java 24 on, a JDK carries
#   external/jmods-windows.zip   none, Temurin publishes them apart
#   external/piper               Piper, the speech synthesis the desktop server reads the stories aloud with
#   external/piper-linux.tar.gz  Piper for the Linux distribution     } the distributions bundle them
#   external/piper-windows.zip   Piper for the Windows distribution   }
#   external/voices/<model>.onnx Piper's voices (the VOICE_* below), each with its <model>.onnx.json
#   external/gradle              Gradle, which builds the Android app (android/)  } scripts/linux/setup.sh --android
#   external/android-sdk         the Android SDK it builds against               } only (about a gigabyte)
#   external/android-avd         the emulator's virtual phone (scripts/linux/emulator.sh creates it; setup.sh --emulator
#                                installs the emulator and its system image into the SDK: 2 to 3 GB more)
#   external/downloads/          the archives as downloaded, kept so that a second run downloads nothing
# The versions live here and nowhere else.
#
# MIRROR: a local Artifactory (any HTTP folder) holding the same file names, fetched as <MIRROR>/<file name>
# instead of the URLs below; empty, the URLs are used. When the mirror wants authentication:
#   MIRROR_TOKEN          sent with every download from the mirror in the header MIRROR_TOKEN_HEADER, which is
#                         "Authorization: Bearer" by default (an Artifactory access token) — "X-JFrog-Art-Api:"
#                         for an Artifactory API key, any "Name:" the mirror expects
#   MIRROR_USER, MIRROR_PASSWORD   basic authentication instead (a user and its password or API key)
# Keep secrets out of this file: put them in externals.local.conf next to it (same syntax, not under source
# control) or in the environment. The environment wins over externals.local.conf, which wins over this file.
MIRROR=
MIRROR_TOKEN=
MIRROR_TOKEN_HEADER=Authorization: Bearer
MIRROR_USER=
MIRROR_PASSWORD=
JDK_LINUX=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz
JDK_WINDOWS=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_windows_hotspot_25.0.5_8.zip
JMODS_LINUX=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jmods_x64_linux_hotspot_25.0.5_8.tar.gz
JMODS_WINDOWS=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jmods_x64_windows_hotspot_25.0.5_8.zip
MAVEN_LINUX=https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
MAVEN_WINDOWS=https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.zip
# Node.js, an LTS line the Angular CLI supports (see its "engines" in frontend/package-lock.json)
NODE_LINUX=https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz
NODE_WINDOWS=https://nodejs.org/dist/v24.21.0/node-v24.21.0-win-x64.zip
# Piper (MIT, rhasspy/piper; the repository is archived, its releases stay) and its voices: neural, offline. Each
# VOICE_* is a model; its .onnx.json is at the same address plus ".json". The page's settings offer them as
# desktop/src/main/resources/voices.json names them (a model may hold several speakers), its first voice of each
# language the default; licences/embedded.json and desktop/src/dist/VOICES.md credit them, as their licences ask.
# A voice added here needs its entries there too (EmbeddedLicencesTest and PiperSynthesizerTest check).
PIPER_LINUX=https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
PIPER_WINDOWS=https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip
VOICE_FR_SIWIS=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx
VOICE_FR_UPMC=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/upmc/medium/fr_FR-upmc-medium.onnx
VOICE_EN_ALBA=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/alba/medium/en_GB-alba-medium.onnx
VOICE_EN_CORI=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/cori/medium/en_GB-cori-medium.onnx
VOICE_EN_NORTHERN=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/northern_english_male/medium/en_GB-northern_english_male-medium.onnx
# The Android build (scripts/linux/setup.sh --android): Gradle, which runs the Android Gradle Plugin (android/), and
# the Android SDK — its command-line tools, then the packages sdkmanager installs from them, space-separated
# (the platform is android/build.gradle.kts's compileSdk; platform-tools brings adb, which scripts/linux/run-android.sh uses).
# Gradle for the Android build alone, deployed by setup --android: named ANDROID_GRADLE so that the devkit, which
# deploys a GRADLE always, leaves it to scripts/linux/setup.local.sh
ANDROID_GRADLE=https://services.gradle.org/distributions/gradle-9.8.0-bin.zip
ANDROID_CMDLINE_TOOLS_LINUX=https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
ANDROID_CMDLINE_TOOLS_WINDOWS=https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip
ANDROID_SDK_PACKAGES=platform-tools platforms;android-36 build-tools;36.1.0
# The emulator (scripts/linux/setup.sh --emulator, scripts/linux/emulator.sh): the emulator and the system image of its virtual
# phone, the platform's (compileSdk); a Google Play image, which carries Google's text-to-speech for the speaker
# button. The phone it emulates: one of `avdmanager list device -c`.
ANDROID_EMULATOR_PACKAGES=emulator system-images;android-36;google_apis_playstore;x86_64
ANDROID_AVD_DEVICE=pixel_7
