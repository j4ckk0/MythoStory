# The externals of the project: the software the build and the distributions need, none of it under source
# control. scripts/setup.sh (Linux) / scripts\setup.bat (Windows) download these into external/ and deploy them
# under generic names, the only ones the scripts and the build know:
#   external/jdk                 the JDK that compiles and runs the backend (the scripts' JAVA_HOME)
#   external/maven               Maven, which builds the whole project
#   external/node                Node.js and npm, which build the frontend (run by Maven: frontend/pom.xml)
#   external/jre-linux.tar.gz    the JRE bundled in the Linux distribution   (scripts/package.sh)
#   external/jre-windows.zip     the JRE bundled in the Windows distribution
#   external/piper               Piper, the speech synthesis the desktop server reads the stories aloud with
#   external/piper-linux.tar.gz  Piper for the Linux distribution     } the distributions bundle them
#   external/piper-windows.zip   Piper for the Windows distribution   }
#   external/voices/<lang>.onnx  Piper's voices, one per i18n language, and their <lang>.onnx.json
#   external/gradle              Gradle, which builds the Android app (android/)  } scripts/setup.sh --android
#   external/android-sdk         the Android SDK it builds against               } only (about a gigabyte)
#   external/downloads/          the archives as downloaded, kept so that a second run downloads nothing
# The versions live here and nowhere else.
#
# MIRROR: a local Artifactory (any HTTP folder) holding the same file names, fetched as <MIRROR>/<file name>
# instead of the URLs below; empty, the URLs are used. When the mirror wants authentication:
#   MIRROR_TOKEN          sent with every download from the mirror in the header MIRROR_TOKEN_HEADER, which is
#                         "Authorization: Bearer" by default (an Artifactory access token) — "X-JFrog-Art-Api:"
#                         for an Artifactory API key, any "Name:" the mirror expects
#   MIRROR_USER, MIRROR_PASSWORD   basic authentication instead (a user and its password or API key)
# Keep secrets out of this file: put them in externals.local.conf next to it (same syntax, not under source
# control) or in the environment. The environment wins over externals.local.conf, which wins over this file.
MIRROR=
MIRROR_TOKEN=
MIRROR_TOKEN_HEADER=Authorization: Bearer
MIRROR_USER=
MIRROR_PASSWORD=
JDK_LINUX=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1+1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz
JDK_WINDOWS=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1+1/OpenJDK25U-jdk_x64_windows_hotspot_25.0.4.1_1.zip
MAVEN_LINUX=https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
MAVEN_WINDOWS=https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.zip
# Node.js, an LTS line the Angular CLI supports (see its "engines" in frontend/package-lock.json)
NODE_LINUX=https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz
NODE_WINDOWS=https://nodejs.org/dist/v24.21.0/node-v24.21.0-win-x64.zip
JRE_LINUX=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1+1/OpenJDK25U-jre_x64_linux_hotspot_25.0.4.1_1.tar.gz
JRE_WINDOWS=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1+1/OpenJDK25U-jre_x64_windows_hotspot_25.0.4.1_1.zip
# Piper (MIT, rhasspy/piper; the repository is archived, its releases stay) and its voices, one per i18n language:
# neural, offline, trained on CC BY 4.0 datasets — the distributions credit them (desktop/src/dist/VOICES.md).
PIPER_LINUX=https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
PIPER_WINDOWS=https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip
VOICE_FR=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx
VOICE_FR_CONFIG=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json
VOICE_EN=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/alba/medium/en_GB-alba-medium.onnx
VOICE_EN_CONFIG=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/alba/medium/en_GB-alba-medium.onnx.json
# The Android build (scripts/setup.sh --android): Gradle, which runs the Android Gradle Plugin (android/), and
# the Android SDK — its command-line tools, then the packages sdkmanager installs from them, space-separated
# (the platform is android/build.gradle.kts's compileSdk; platform-tools brings adb, which scripts/run.sh --android uses).
GRADLE=https://services.gradle.org/distributions/gradle-9.8.0-bin.zip
ANDROID_CMDLINE_TOOLS_LINUX=https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
ANDROID_CMDLINE_TOOLS_WINDOWS=https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip
ANDROID_SDK_PACKAGES=platform-tools platforms;android-36 build-tools;36.1.0
